name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  release:
    types: [ published ]

env:
  DOTNET_VERSION: '8.0.x'
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Restore dependencies
      run: dotnet restore

    - name: Build
      run: dotnet build --configuration Release --no-restore

    - name: Test
      run: dotnet test --configuration Release --no-build --verbosity normal --collect:"XPlat Code Coverage" --results-directory ./coverage

    - name: Upload coverage reports
      uses: codecov/codecov-action@v4
      if: github.event_name != 'release'
      with:
        directory: ./coverage
        fail_ci_if_error: false
      continue-on-error: true

    - name: Publish API
      run: dotnet publish src/XcluadeAgent.Api/XcluadeAgent.Api.csproj -c Release -o ./publish/api

    - name: Publish CLI
      run: dotnet publish src/XcluadeAgent.Cli/XcluadeAgent.Cli.csproj -c Release -o ./publish/cli

    - name: Publish Worker
      run: dotnet publish src/XcluadeAgent.Worker/XcluadeAgent.Worker.csproj -c Release -o ./publish/worker

    - name: Upload API artifact
      uses: actions/upload-artifact@v4
      with:
        name: xcluadeagent-api
        path: ./publish/api

    - name: Upload CLI artifact
      uses: actions/upload-artifact@v4
      with:
        name: xcluadeagent-cli
        path: ./publish/cli

    - name: Upload Worker artifact
      uses: actions/upload-artifact@v4
      with:
        name: xcluadeagent-worker
        path: ./publish/worker

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: build

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Run security scan
      run: |
        dotnet tool install --global security-scan || true
        dotnet restore
      continue-on-error: true

  docker:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' || github.event_name == 'release'

    permissions:
      contents: read
      packages: write

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        tags: |
          type=ref,event=branch
          type=ref,event=pr
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
          type=sha

    - name: Build and push
      uses: docker/build-push-action@v6
      with:
        context: .
        file: ./docker/Dockerfile
        push: ${{ github.event_name != 'pull_request' }}
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

  release:
    name: Create Release Assets
    runs-on: ubuntu-latest
    needs: [build, docker]
    if: github.event_name == 'release'

    strategy:
      matrix:
        runtime: [linux-x64, linux-arm64, win-x64, osx-x64, osx-arm64]

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Publish self-contained
      run: |
        dotnet publish src/XcluadeAgent.Api/XcluadeAgent.Api.csproj \
          -c Release \
          -r ${{ matrix.runtime }} \
          --self-contained true \
          -p:PublishSingleFile=true \
          -p:PublishTrimmed=false \
          -o ./release/${{ matrix.runtime }}

    - name: Create archive (Linux/macOS)
      if: startsWith(matrix.runtime, 'linux') || startsWith(matrix.runtime, 'osx')
      run: |
        cd ./release/${{ matrix.runtime }}
        tar -czvf ../xcluadeagent-${{ matrix.runtime }}.tar.gz .

    - name: Create archive (Windows)
      if: startsWith(matrix.runtime, 'win')
      run: |
        cd ./release/${{ matrix.runtime }}
        zip -r ../xcluadeagent-${{ matrix.runtime }}.zip .

    - name: Upload release asset
      uses: softprops/action-gh-release@v1
      with:
        files: |
          ./release/xcluadeagent-${{ matrix.runtime }}.*
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy-docs:
    name: Deploy Documentation
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'

    permissions:
      contents: read
      pages: write
      id-token: write

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Build docs
      run: |
        mkdir -p ./docs-site
        cp README.md ./docs-site/index.md
        cp -r docs/* ./docs-site/ 2>/dev/null || true

    - name: Upload Pages artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: ./docs-site

    - name: Deploy to GitHub Pages
      uses: actions/deploy-pages@v4
      continue-on-error: true
